service:
  name: ""
  type: stateless
  env: dev
  team: default

image:
  repo: ""
  tag: "latest"
  pullPolicy: IfNotPresent

runtime:
  port: 8080
  health:
    path: /health
    initialDelaySeconds: 5
    periodSeconds: 10

deploy:
  replicas: 1

job:
  command: []              # keep array (schema-valid)
  backoffLimit: 2
  ttlSecondsAfterFinished: 600

engine:
  name: ""                 # keep string (schema-valid)
  version: ""

storage:
  size: ""                 # keep string (schema-valid)
  class: ""

resources:
  profile: api-small

profiles:
  api-small:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  api-medium:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi

  db-small:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "1"
      memory: 2Gi

  db-medium:
    requests:
      cpu: "1"
      memory: 2Gi
    limits:
      cpu: "2"
      memory: 4Gi

  job-small:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 256Mi

expose:
  enabled: false
  host: ""
  path: /
  className: nginx
